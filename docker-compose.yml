version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-services-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=your-secret-key-change-in-production
    networks:
      - it-services-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it-services-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - it-services-network
    restart: unless-stopped

networks:
  it-services-network:
    driver: bridge
