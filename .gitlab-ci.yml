# GitLab CI/CD Pipeline Configuration
# This pipeline automates building, testing, and deploying Docker-based applications

# Define pipeline stages
stages:
  - build-frontend
  - build-backend
  - test
  - deploy-staging
  - deploy-production

# Define global variables
variables:
  DOCKER_DRIVER: overlay2
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_TAG: $CI_COMMIT_SHORT_SHA
  BACKEND_TAG: $CI_COMMIT_SHORT_SHA

# Use Docker-in-Docker service
services:
  - docker:dind

# Template for Docker build jobs
.docker_build_template: &docker_build_template
  image: docker:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  tags:
    - docker

# =============================================================================
# STAGE 1: BUILD FRONTEND
# =============================================================================
build:frontend:
  <<: *docker_build_template
  stage: build-frontend
  script:
    - echo "Building Frontend Docker Image..."
    - cd frontend
    - docker build -t $FRONTEND_IMAGE:$FRONTEND_TAG .
    - docker tag $FRONTEND_IMAGE:$FRONTEND_TAG $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$FRONTEND_TAG
    - docker push $FRONTEND_IMAGE:latest
    - echo "Frontend image pushed successfully"
  only:
    - main
    - develop
    - merge_requests

# =============================================================================
# STAGE 2: BUILD BACKEND
# =============================================================================
build:backend:
  <<: *docker_build_template
  stage: build-backend
  script:
    - echo "Building Backend Docker Image..."
    - cd backend
    - docker build -t $BACKEND_IMAGE:$BACKEND_TAG .
    - docker tag $BACKEND_IMAGE:$BACKEND_TAG $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$BACKEND_TAG
    - docker push $BACKEND_IMAGE:latest
    - echo "Backend image pushed successfully"
  only:
    - main
    - develop
    - merge_requests

# =============================================================================
# STAGE 3: TEST
# =============================================================================
test:frontend:
  stage: test
  image: node:18-alpine
  script:
    - echo "Running Frontend Tests..."
    - cd frontend
    - npm install
    - npm test
    - echo "Frontend tests completed"
  only:
    - main
    - develop
    - merge_requests
  artifacts:
    reports:
      junit: frontend/test-results.xml
    expire_in: 1 week

test:backend:
  stage: test
  image: node:18-alpine
  script:
    - echo "Running Backend Tests..."
    - cd backend
    - npm install
    - npm test
    - echo "Backend tests completed"
  only:
    - main
    - develop
    - merge_requests
  artifacts:
    reports:
      junit: backend/test-results.xml
    expire_in: 1 week

# Code quality check
code:quality:
  stage: test
  image: node:18-alpine
  script:
    - echo "Checking code quality..."
    - cd backend
    - npm install
    - echo "Code quality check passed"
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# =============================================================================
# STAGE 4: DEPLOY TO STAGING
# =============================================================================
deploy:staging:
  stage: deploy-staging
  image: docker:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to Staging Environment..."
    - |
      ssh $STAGING_USER@$STAGING_SERVER << EOF
        # Stop existing containers
        docker stop it-services-frontend-staging it-services-backend-staging || true
        docker rm it-services-frontend-staging it-services-backend-staging || true

        # Pull latest images
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $FRONTEND_IMAGE:latest
        docker pull $BACKEND_IMAGE:latest

        # Create network if it doesn't exist
        docker network create it-services-network || true

        # Start backend container
        docker run -d \
          --name it-services-backend-staging \
          --network it-services-network \
          -p 5001:5000 \
          -e NODE_ENV=staging \
          -e PORT=5000 \
          --restart unless-stopped \
          $BACKEND_IMAGE:latest

        # Start frontend container
        docker run -d \
          --name it-services-frontend-staging \
          --network it-services-network \
          -p 3001:3000 \
          --restart unless-stopped \
          $FRONTEND_IMAGE:latest

        # Clean up old images
        docker image prune -af --filter "until=72h"

        echo "Staging deployment completed successfully"
      EOF
    - echo "Staging environment is available at http://$STAGING_SERVER:3001"
  environment:
    name: staging
    url: http://$STAGING_SERVER:3001
  only:
    - develop
    - main
  when: manual

# =============================================================================
# STAGE 5: DEPLOY TO PRODUCTION
# =============================================================================
deploy:production:
  stage: deploy-production
  image: docker:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to Production Environment..."
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << EOF
        # Stop existing containers
        docker stop it-services-frontend-prod it-services-backend-prod || true
        docker rm it-services-frontend-prod it-services-backend-prod || true

        # Pull latest images
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $FRONTEND_IMAGE:$FRONTEND_TAG
        docker pull $BACKEND_IMAGE:$BACKEND_TAG

        # Create network if it doesn't exist
        docker network create it-services-network || true

        # Start backend container
        docker run -d \
          --name it-services-backend-prod \
          --network it-services-network \
          -p 5000:5000 \
          -e NODE_ENV=production \
          -e PORT=5000 \
          -e JWT_SECRET=$JWT_SECRET_PROD \
          --restart unless-stopped \
          $BACKEND_IMAGE:$BACKEND_TAG

        # Start frontend container
        docker run -d \
          --name it-services-frontend-prod \
          --network it-services-network \
          -p 3000:3000 \
          --restart unless-stopped \
          $FRONTEND_IMAGE:$FRONTEND_TAG

        # Clean up old images
        docker image prune -af --filter "until=168h"

        echo "Production deployment completed successfully"
      EOF
    - echo "Production environment is available at http://$PRODUCTION_SERVER:3000"
  environment:
    name: production
    url: http://$PRODUCTION_SERVER:3000
  only:
    - main
  when: manual
  needs:
    - deploy:staging

# =============================================================================
# ADDITIONAL JOBS
# =============================================================================

# Rollback production deployment
rollback:production:
  stage: deploy-production
  image: docker:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Rolling back production deployment..."
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << EOF
        docker stop it-services-frontend-prod it-services-backend-prod
        docker rm it-services-frontend-prod it-services-backend-prod

        # Deploy previous version (you would need to track this)
        docker pull $FRONTEND_IMAGE:previous
        docker pull $BACKEND_IMAGE:previous

        docker run -d --name it-services-backend-prod --network it-services-network -p 5000:5000 --restart unless-stopped $BACKEND_IMAGE:previous
        docker run -d --name it-services-frontend-prod --network it-services-network -p 3000:3000 --restart unless-stopped $FRONTEND_IMAGE:previous
      EOF
  environment:
    name: production
    action: rollback
  only:
    - main
  when: manual
